<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
</head>
<body>
    <!-- to access nth child we use id -->
    <p id="demo"></p>;  
    <script>
        
         const car=["car1","car2","car3"];
         let len=car.length;
         let text=" ";
         for(let i=0;i < len;i+2){
            text+=car[i]+"<br>";

         }
         document.getElementById("demo").innerHTML=text;

    </script>
    
</body>
</html>
